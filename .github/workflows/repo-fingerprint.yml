name: Compute repo fingerprint

on:
  push:
    branches:
      - '**'

jobs:
  fingerprint:
    name: Compute and upload repo fingerprint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Make script executable
        run: chmod +x scripts/repo-hash.sh

      - name: Compute fingerprint (tracked files only)
        id: compute
        run: |
          ./scripts/repo-hash.sh > repo-hash.txt
          echo "fingerprint=$(cat repo-hash.txt)" >> $GITHUB_OUTPUT

      - name: Upload fingerprint artifact
        uses: actions/upload-artifact@v4
        with:
          name: repo-fingerprint
          path: repo-hash.txt
