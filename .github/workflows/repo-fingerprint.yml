name: Compute repo fingerprint

on:
  push:
    branches:
      - '**'

jobs:
  fingerprint:
    name: Compute and upload repo fingerprint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Make script executable
        run: chmod +x scripts/repo-hash.sh

      - name: Compute fingerprint (tracked files only)
        id: compute_tracked
        run: |
          ./scripts/repo-hash.sh > repo-hash-tracked.txt
          echo "fingerprint_tracked=$(cat repo-hash-tracked.txt)" >> $GITHUB_OUTPUT

      - name: Upload tracked fingerprint artifact
        uses: actions/upload-artifact@v4
        with:
          name: repo-fingerprint-tracked
          path: repo-hash-tracked.txt

      - name: Compute fingerprint (include untracked files)
        id: compute_untracked
        run: |
          ./scripts/repo-hash.sh -u > repo-hash-untracked.txt
          echo "fingerprint_untracked=$(cat repo-hash-untracked.txt)" >> $GITHUB_OUTPUT

      - name: Upload untracked fingerprint artifact
        uses: actions/upload-artifact@v4
        with:
          name: repo-fingerprint-untracked
          path: repo-hash-untracked.txt
